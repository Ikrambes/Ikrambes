<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"/>
<title>Snake — Ikram Besbassi</title>
<meta name="description" content="A small Snake game, built by Ikram Besbassi."/>
<link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <span>IKRAM BESBASSI · SNAKE</span>
      <a href="https://github.com/Ikrambes" target="_blank" rel="noopener noreferrer">← profile</a>
    </div>

    <div class="hud">
      <div class="stat">
        <span class="label">Score</span>
        <span class="value" id="score">0000</span>
      </div>
      <div class="stat best">
        <span class="label">Best</span>
        <span class="value" id="best">0000</span>
      </div>
    </div>

    <div class="stage">
      <canvas id="game" width="440" height="440"></canvas>

      <div class="overlay" id="start-overlay">
        <h1>SNAKE</h1>
        <p class="sub">arrow keys / WASD to move · space to start · P to pause</p>

        <div class="customize">
          <div class="custom-group">
            <span class="custom-label">Snake color</span>
            <div class="swatches" id="color-swatches">
              <button class="swatch" data-color="green" style="--sw:#22c55e" aria-label="Green"></button>
              <button class="swatch" data-color="blue" style="--sw:#3b82f6" aria-label="Blue"></button>
              <button class="swatch" data-color="purple" style="--sw:#a855f7" aria-label="Purple"></button>
              <button class="swatch selected" data-color="orange" style="--sw:#ea580c" aria-label="Orange"></button>
              <button class="swatch" data-color="pink" style="--sw:#ec4899" aria-label="Pink"></button>
              <button class="swatch" data-color="cyan" style="--sw:#06b6d4" aria-label="Cyan"></button>
              <button class="swatch" data-color="red" style="--sw:#ef4444" aria-label="Red"></button>
              <input type="color" id="custom-color-input" class="custom-swatch" value="#ffffff" aria-label="Custom color" title="Custom color"/>
            </div>
          </div>
          <div class="custom-group">
            <span class="custom-label">Fruit</span>
            <div class="fruit-options" id="fruit-options">
              <button class="fruit-btn selected" data-fruit="apple" aria-label="Apple">🍎</button>
              <button class="fruit-btn" data-fruit="strawberry" aria-label="Strawberry">🍓</button>
              <button class="fruit-btn" data-fruit="orange" aria-label="Orange">🍊</button>
              <button class="fruit-btn" data-fruit="cherry" aria-label="Cherry">🍒</button>
              <button class="fruit-btn" data-fruit="lemon" aria-label="Lemon">🍋</button>
              <button class="fruit-btn" data-fruit="grapes" aria-label="Grapes">🍇</button>
            </div>
          </div>
        </div>

        <button class="play" id="start-btn">Start Game</button>
      </div>

      <div class="overlay hidden" id="over-overlay">
        <h1 class="halt">SYSTEM HALTED</h1>
        <p class="score-line" id="final-score">Score: 0000</p>
        <p class="new-best" id="new-best">New Best</p>
        <button class="play" id="retry-btn">Try Again</button>
      </div>
    </div>

    <p class="controls-hint">swipe or use the pad below on touch devices</p>

    <div class="dpad">
      <button class="up" data-dir="up" aria-label="up">▲</button>
      <button class="left" data-dir="left" aria-label="left">◀</button>
      <button class="down" data-dir="down" aria-label="down">▼</button>
      <button class="right" data-dir="right" aria-label="right">▶</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
